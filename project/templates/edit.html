<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>編輯單音旋律</title>
  <style>
  body{
    font-family:ui-sans-serif,system-ui,"Segoe UI","Noto Sans TC",Arial;
    margin:0;
    background:#f7f7f7;
    overflow-x:hidden;        /* 避免整頁左右捲動 */
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    background:#222;
    color:#fff;
  }
  .meta{font-size:14px;opacity:.85}

  .wrap{
    display:flex;
    gap:12px;
    padding:12px;
    align-items:flex-start;
    max-width:100%;           /* 不超出視窗寬 */
    box-sizing:border-box;
  }

  /* 左邊鍵盤 + 右邊捲軸 */
  .editor{
    display:flex;
    flex:1;
    gap:0;
    max-width:100%;           /* 整個 editor 不超出視窗 */
    overflow:hidden;          /* 多出來的交給右邊容器自己捲 */
  }

  .panel{
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 16px rgba(0,0,0,.08);
  }

  #piano{
    display:block;
    border-radius:10px 0 0 10px;
  }

  .roll-container{
    flex:1;
    min-width:0;              /* 關鍵：允許比內容窄，內容在裡面 overflow */
    overflow-x:auto;
    overflow-y:hidden;
    padding:0;
    border-radius:0 10px 10px 0;
  }
  .roll-container canvas{
    display:block;
    border-radius:0 10px 10px 0;
  }

  #roll{
    cursor:default;
  }

  .side{
    padding:12px 16px
  }
  .btn{
    appearance:none;border:0;border-radius:8px;
    padding:10px 14px;background:#0b79d0;color:#fff;
    font-weight:600;cursor:pointer
  }
  .row{display:flex;gap:10px;align-items:center;margin:6px 0}
  .hint{font-size:13px;color:#555}
  ul{margin:6px 0 0 16px;padding:0}

  /* 工具列 */
  .tool-bar{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
    font-size:13px;
  }
  .tool-label{
    color:#555;
  }
  .tool-btn{
    appearance:none;
    border-radius:6px;
    border:1px solid #ccc;
    background:#fff;
    padding:4px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .tool-btn.tool-active{
    border-color:#0b79d0;
    background:#e6f2ff;
    color:#0b79d0;
    font-weight:600;
  }
  </style>
</head>
<body>
<header>
  <div>
    <div><strong>單音鋼琴捲軸編輯器</strong></div>
    <div class="meta">檔案：{{ filename }}</div>
  </div>
  <div class="row">
    <button id="playBtn" class="btn">▶ 播放目前旋律</button>
    <button id="stopBtn" class="btn">⏹ 停止播放</button>
    <button id="exportBtn" class="btn">輸出成單音 MIDI</button>
  </div>
</header>

<!-- 初始 notes JSON -->
<script id="notes-data" type="application/json">{{ notes_json|safe }}</script>

<div class="wrap">
  <div class="editor">
    <!-- 左邊音階尺 -->
    <canvas id="piano" class="panel"></canvas>

    <!-- 右邊鋼琴捲軸（可左右滾動） -->
    <div class="panel roll-container">
      <canvas id="roll"></canvas>
    </div>
  </div>

  <div class="panel side">
    <div class="row"><strong>操作說明</strong></div>
    <div class="hint">
      <ul>
        <li>拖曳音符移動；拖拉左右邊緣可改長度</li>
        <li>橫向格線等距（每格約 0.05 秒）</li>
        <li>左側顯示對應音階（C3, C4...）。</li>
      </ul>
      <p>※ 送回後端時會自動單音化（遇重疊即切斷前一音）。</p>
    </div>

    <!-- 工具列 -->
    <div class="tool-bar">
      <span class="tool-label">工具：</span>
      <button id="tool-edit"   class="tool-btn tool-active">一般編輯</button>
      <button id="tool-add"    class="tool-btn">新增音符</button>
      <button id="tool-delete" class="tool-btn">刪除音符</button>
    </div>
  </div>
</div>

<script>
  const ORIGINAL_FILENAME = {{ filename | tojson }};

  // 常數：要跟 app.py 的 SEC_PER_UNIT 對應
  const UNITS_PER_SECOND = 20;   // 1 秒 20 格 → 每格 0.05 秒
  const UNITS_PER_BAR = 80;      // 一小節 4 秒
  const DEFAULT_NOTE_UNITS = 20; // 新增音符預設 1 秒長

  const INIT_NOTES = JSON.parse(document.getElementById('notes-data').textContent || '[]');

  // Piano-roll 視覺參數
  const R = {
    lanes: 48,         // 顯示的音高列數
    pitchMin: 48,      // C3=48 起
    laneH: 16,
    unitW: 12,         // 1 格寬
    bars: 12,          // 顯示幾小節
    unitsPerBar: UNITS_PER_BAR,
  };

  const rollCanvas = document.getElementById('roll');
  const pianoCanvas = document.getElementById('piano');
  const rollContainer = document.querySelector('.roll-container');

  // 設定鋼琴捲軸尺寸
  rollCanvas.width  = R.unitW * R.unitsPerBar * R.bars;
  rollCanvas.height = R.laneH * R.lanes;
  rollCanvas.style.width  = rollCanvas.width + 'px';
  rollCanvas.style.height = rollCanvas.height + 'px';

  // 設定音階尺尺寸（固定寬度 70px）
  pianoCanvas.width  = 70;
  pianoCanvas.height = rollCanvas.height;
  pianoCanvas.style.width  = pianoCanvas.width + 'px';
  pianoCanvas.style.height = rollCanvas.style.height;

  const rollCtx  = rollCanvas.getContext('2d');
  const pianoCtx = pianoCanvas.getContext('2d');

  // ------- 狀態 -------
  let notes = INIT_NOTES.map(n => ({...n})); // {pitch,start,end}
  let modeAdd = false;     // 是否為「新增音符」模式
  let modeDelete = false;  // 是否為「刪除音符」模式
  let dragging = null;     // {idx, edge:"left"|"right"|null, offU, offLane}

  // 播放相關狀態
  let audioCtx = null;
  let isPlaying = false;
  let scheduledNodes = [];
  let playHeadUnit = null;  // 目前播放到第幾個單位格
  let playStartUnit = 0;    // 從哪一格開始播
  let playStartTime = 0;    // AudioContext 開始播的時間戳
  let playAnimId = null;    // requestAnimationFrame id

  // ------- 工具列按鈕 -------
  const toolEditBtn   = document.getElementById('tool-edit');
  const toolAddBtn    = document.getElementById('tool-add');
  const toolDeleteBtn = document.getElementById('tool-delete');

  function setTool(mode){
    // mode: 'edit' | 'add' | 'delete'
    modeAdd    = (mode === 'add');
    modeDelete = (mode === 'delete');

    [toolEditBtn, toolAddBtn, toolDeleteBtn].forEach(btn=>{
      if(!btn) return;
      btn.classList.remove('tool-active');
    });
    if(mode === 'add')         toolAddBtn.classList.add('tool-active');
    else if(mode === 'delete') toolDeleteBtn.classList.add('tool-active');
    else                       toolEditBtn.classList.add('tool-active');

    // 切工具時重畫一次（新增模式會套淡藍色遮罩）
    drawAll();
  }

  toolEditBtn .addEventListener('click', ()=> setTool('edit'));
  toolAddBtn  .addEventListener('click', ()=> setTool('add'));
  toolDeleteBtn.addEventListener('click', ()=> setTool('delete'));

  // ------- 座標 / 音名工具函式 -------
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  function midiToNoteName(p){
    const name = NOTE_NAMES[p % 12];
    const octave = Math.floor(p / 12) - 1; // MIDI 60 → C4
    return name + octave;
  }

  function pitchToLane(p){ return (R.pitchMin + R.lanes - 1) - p; }
  function laneToPitch(l){ return (R.pitchMin + R.lanes - 1) - l; }
  function xToUnit(x){ return Math.max(0, Math.round(x / R.unitW)); }
  function yToLane(y){ return Math.max(0, Math.min(R.lanes-1, Math.floor(y / R.laneH))); }

  // 預設是一般編輯（此時 NOTE_NAMES 等都已經初始化）
  setTool('edit');

  // ------- 座標 / 音名工具函式 -------
  function pitchToLane(p){ return (R.pitchMin + R.lanes - 1) - p; }
  function laneToPitch(l){ return (R.pitchMin + R.lanes - 1) - l; }
  function xToUnit(x){ return Math.max(0, Math.round(x / R.unitW)); }
  function yToLane(y){ return Math.max(0, Math.min(R.lanes-1, Math.floor(y / R.laneH))); }

  // 轉換滑鼠座標 → roll canvas 內部座標（考慮 CSS 縮放）
  function getMousePos(evt){
    const rect = rollCanvas.getBoundingClientRect();
    const scaleX = rollCanvas.width  / rect.width;
    const scaleY = rollCanvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top)  * scaleY
    };
  }

  // ------- 畫左側音階尺 -------
  function drawPiano(){
    const w = pianoCanvas.width;
    const h = pianoCanvas.height;
    pianoCtx.clearRect(0, 0, w, h);

    for(let l=0; l<R.lanes; l++){
      const p = laneToPitch(l);
      const y = l * R.laneH;
      const isBlack = (p%12===1 || p%12===3 || p%12===6 || p%12===8 || p%12===10);

      // 鍵盤底色
      pianoCtx.fillStyle = isBlack ? '#555' : '#f5f5f5';
      pianoCtx.fillRect(0, y, w, R.laneH);

      // 水平分隔線
      pianoCtx.beginPath();
      pianoCtx.moveTo(0, y + 0.5);
      pianoCtx.lineTo(w, y + 0.5);
      pianoCtx.strokeStyle = '#999';
      pianoCtx.lineWidth = 1;
      pianoCtx.stroke();

      // 只在 C 音標註音名（避免太擠）
      if (p % 12 === 0) { // C
        const label = midiToNoteName(p);
        pianoCtx.fillStyle = isBlack ? '#fff' : '#333';
        pianoCtx.font = '11px system-ui';
        pianoCtx.fillText(label, 6, y + R.laneH - 4);
      }
    }
  }

  // ------- 畫右側鋼琴捲軸 -------
  function drawRoll(){
    rollCtx.clearRect(0,0,rollCanvas.width,rollCanvas.height);

    // 背景鍵盤色（與左側一致）
    for(let l=0; l<R.lanes; l++){
      const p = laneToPitch(l) % 12;
      const isBlack = (p===1 || p===3 || p===6 || p===8 || p===10);
      rollCtx.fillStyle = isBlack ? '#f2f2f6' : '#f9f9fb';
      rollCtx.fillRect(0, l*R.laneH, rollCanvas.width, R.laneH);
    }

    // 垂直格線：小節、每秒、其餘
    const totalUnits = R.unitsPerBar * R.bars;
    for(let u=0; u<=totalUnits; u++){
      const x = u * R.unitW;

      rollCtx.beginPath();
      rollCtx.moveTo(x, 0);
      rollCtx.lineTo(x, rollCanvas.height);
      let color = '#eee';
      if (u % R.unitsPerBar === 0) color = '#bbb';         // 小節
      else if (u % UNITS_PER_SECOND === 0) color = '#ddd'; // 每秒
      rollCtx.strokeStyle = color;
      rollCtx.lineWidth = (u % R.unitsPerBar === 0) ? 1.2 : 1;
      rollCtx.stroke();

      // 每 1 秒在上方標時間（0,1,2,...）
      if (u % UNITS_PER_SECOND === 0) {
        const sec = u / UNITS_PER_SECOND;
        rollCtx.fillStyle = '#666';
        rollCtx.font = '11px system-ui';
        rollCtx.fillText(sec.toString(), x + 2, 12);
      }
    }

    // 音符
    notes.forEach(n=>{
      const x  = n.start * R.unitW;
      const w  = Math.max(1, (n.end - n.start) * R.unitW);
      const y  = pitchToLane(n.pitch) * R.laneH + 2;
      const h  = R.laneH - 4;

      rollCtx.fillStyle = '#0b79d0';
      rollCtx.fillRect(x, y, w, h);
      rollCtx.fillStyle = '#084d80';
      rollCtx.fillRect(x, y, 4, h);
      rollCtx.fillRect(x + w - 4, y, 4, h);
    });

    if(modeAdd){
      rollCtx.fillStyle = 'rgba(11,121,208,.08)';
      rollCtx.fillRect(0, 0, rollCanvas.width, rollCanvas.height);
    }

    // 紅色播放線（playHeadUnit 由滑鼠或播放功能控制）
    if (typeof playHeadUnit === 'number') {
      const x = playHeadUnit * R.unitW + 0.5;
      rollCtx.beginPath();
      rollCtx.moveTo(x, 0);
      rollCtx.lineTo(x, rollCanvas.height);
      rollCtx.strokeStyle = isPlaying
        ? 'rgba(220,0,0,0.9)'
        : 'rgba(150,0,0,0.6)';
      rollCtx.lineWidth = 2;
      rollCtx.stroke();
    }
  }

  function drawAll(){
    drawPiano();
    drawRoll();
  }

  // ------- 命中測試 -------
  function hitTest(x, y){
    for(let i=notes.length-1;i>=0;i--){
      const n = notes[i];
      const x1 = n.start * R.unitW;
      const x2 = n.end   * R.unitW;
      const y1 = pitchToLane(n.pitch)*R.laneH+2;
      const y2 = y1 + (R.laneH-4);
      if(x>=x1 && x<=x2 && y>=y1 && y<=y2){
        const edge = (x - x1 < 6) ? 'left' : ((x2 - x < 6) ? 'right' : null);
        return {idx:i, edge};
      }
    }
    return null;
  }

  // ------- 滑鼠事件：新增 / 移動 / 改長度 / 移動紅線 -------
  rollCanvas.addEventListener('mousedown', (e)=>{
    const {x, y} = getMousePos(e);

    // 刪除模式下由 click 事件處理，這裡不做事
    if (modeDelete) return;

    // 新增模式：點哪裡就加哪裡
    if(modeAdd){
      const lane = yToLane(y);
      const pitch = laneToPitch(lane);
      const u = xToUnit(x);
      notes.push({pitch, start:u, end:u+DEFAULT_NOTE_UNITS}); // 預設 1 秒
      drawAll();
      return;
    }

    // 一般編輯模式
    const hit = hitTest(x,y);
    if(hit){
      // 點到音符 → 準備拖曳 / 拉長縮短
      const n = notes[hit.idx];
      dragging = {
        idx: hit.idx,
        edge: hit.edge,
        offU: xToUnit(x) - n.start,
        offLane: yToLane(y) - pitchToLane(n.pitch),
      };
    }else{
      // 點在空白處 → 移動播放紅線
      playHeadUnit = xToUnit(x);
      drawAll();
    }
  });

  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const {x, y} = getMousePos(e);
    const u = xToUnit(x);
    const lane = yToLane(y);

    const n = notes[dragging.idx];
    if(dragging.edge === 'left'){
      n.start = Math.min(n.end-1, u);
    }else if(dragging.edge === 'right'){
      n.end = Math.max(n.start+1, u);
    }else{
      const dur = n.end - n.start;
      n.start = Math.max(0, u - dragging.offU);
      n.end   = n.start + dur;
      const newLane = lane;
      n.pitch = laneToPitch(Math.max(0, Math.min(R.lanes-1, newLane)));
    }
    drawAll();
  });

  window.addEventListener('mouseup', ()=> dragging=null);

  // 點一下刪除（刪除模式）
  rollCanvas.addEventListener('click', (e)=>{
    if(!modeDelete) return;
    const {x, y} = getMousePos(e);
    const hit = hitTest(x,y);
    if(hit && !dragging){
      notes.splice(hit.idx,1);
      drawAll();
    }
  });

  // =========================
  // Web Audio 播放 + 播放游標
  // =========================
  function ensureAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function midiToFreq(midi){
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function stopPlayback(){
    if (!audioCtx) return;
    isPlaying = false;
    if (playAnimId) {
      cancelAnimationFrame(playAnimId);
      playAnimId = null;
    }
    scheduledNodes.forEach(node=>{
      try{ node.disconnect(); }catch(e){}
      if(node.stop){
        try{ node.stop(0); }catch(e){}
      }
    });
    scheduledNodes = [];
    // 停止後保留最後的位置也可以，如果你想清掉就設為 null
    // playHeadUnit = null;
    drawAll();
  }

  function startPlayheadAnimation(playEndUnit){
    if (!audioCtx) return;
    const ctx = audioCtx;
    const totalSec = (playEndUnit - playStartUnit) / UNITS_PER_SECOND;

    function step(){
      if (!isPlaying) return;
      const elapsed = ctx.currentTime - playStartTime;
      playHeadUnit = playStartUnit + elapsed * UNITS_PER_SECOND;

      // 自動讓游標維持在可視範圍中
      const x = playHeadUnit * R.unitW;
      const viewStart = rollContainer.scrollLeft;
      const viewWidth = rollContainer.clientWidth;
      const viewEnd = viewStart + viewWidth;
      const margin = viewWidth * 0.25;

      if (x < viewStart + margin) {
        rollContainer.scrollLeft = Math.max(0, x - margin);
      } else if (x > viewEnd - margin) {
        rollContainer.scrollLeft = x - viewWidth + margin;
      }

      drawAll();

      if (elapsed <= totalSec + 0.1) {
        playAnimId = requestAnimationFrame(step);
      } else {
        stopPlayback();
      }
    }

    playAnimId = requestAnimationFrame(step);
  }

  function playCurrentNotes(){
    if (!notes.length) return;

    // 如果正在播，先停掉重新播
    if (isPlaying) {
      stopPlayback();
    }
    ensureAudioCtx();

    const ctx = audioCtx;
    const now = ctx.currentTime + 0.05;

    const seq = [...notes].sort((a,b)=>a.start - b.start);
    // 播放起點：有紅線就從紅線，沒有就從第一個音符
    const baseUnit = (typeof playHeadUnit === 'number')
      ? playHeadUnit
      : seq[0].start;

    // 只保留「在起點之後還有聲音」的音符
    const playable = seq.filter(n => n.end > baseUnit);
    if (!playable.length) return;

    playStartUnit = baseUnit;
    playStartTime = now;
    isPlaying = true;
    scheduledNodes = [];

    // 紅線先跳到起點
    playHeadUnit = baseUnit;
    drawAll();

    let maxEndUnit = baseUnit;

    playable.forEach(n=>{
      const startUnit = Math.max(n.start, baseUnit);
      const startSec  = (startUnit - baseUnit) / UNITS_PER_SECOND;
      const durSec    = (n.end - startUnit) / UNITS_PER_SECOND;
      if (durSec <= 0) return;

      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = midiToFreq(n.pitch);
      gain.gain.value = 0.18;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now + startSec);
      osc.stop(now + startSec + durSec);
      scheduledNodes.push(osc, gain);

      if (n.end > maxEndUnit) maxEndUnit = n.end;
    });

    startPlayheadAnimation(maxEndUnit);
  }

  // 綁到按鈕
  document.getElementById('playBtn').addEventListener('click', ()=>{
    playCurrentNotes();
  });

  document.getElementById('stopBtn').addEventListener('click', ()=>{
    stopPlayback();
  });

  // 送回後端（原本就有）
  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    notes = notes.filter(n => n.end > n.start);
    const res = await fetch('/save-midi', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        notes,
        filename: ORIGINAL_FILENAME,
      }),
    });
    const html = await res.text();
    document.open(); document.write(html); document.close();
  });

  drawAll();
</script>
</body>
</html>
