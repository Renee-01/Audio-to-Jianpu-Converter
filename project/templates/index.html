<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>音訊轉換簡譜系統</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #bfaeae;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: url("{{ url_for('static', filename='images/Brown_Collage_Paper_Music_Presentation.png') }}") no-repeat center;
      background-size: cover;
      width: 600px;
      height: 400px;
      padding: 60px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);

      /* 讓內容在卡片裡也置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;

      /* 文字全部置中 */
      text-align: center;
    }

    h1 {
      font-size: 36px;
      color: #fff;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 0 2px 6px rgba(0,0,0,.45);
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      align-items: center;   /* 水平置中所有表單元件 */
      gap: 18px;            /* 元件之間一些距離 */
    }

    .upload-btn {
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      background-color: #eee;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .upload-btn:hover {
      background-color: #ddd;
    }

    input[type="file"] {
      display: none;
    }

    .upload-row {
      text-align: center;
    }

    .option-row {
      color: #fff;
      font-size: 14px;
    }

    .option-row label {
      cursor: pointer;
    }

    .submit-btn {
      padding: 10px 22px;
      border-radius: 24px;
      border: none;
      background-color: #f5f5f5;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.25);
    }

    .submit-btn:hover {
      background-color: #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>音訊轉換簡譜系統</h1>

      <form class="form-grid" action="/audio-upload" method="post" enctype="multipart/form-data">
        <div class="upload-row">
          <label for="file-upload" class="upload-btn">
            選擇 音訊 (.mp3、.wav) 檔案
          </label>
          <input id="file-upload" type="file" name="file" accept=".mp3,.wav" required />
        </div>

        <!-- 是否需要消除伴奏？（置中） -->
        <div class="option-row">
          <label for="remove_accompaniment">
            <input
              type="checkbox"
              id="remove_accompaniment"
              name="remove_accompaniment"
              value="1"
            />
            是否需要消除伴奏？
          </label>
        </div>

        <button type="submit" class="submit-btn">上傳並轉換</button>
      </form>
    </div>
  </div>
</body>
</html>
