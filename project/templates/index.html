<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>音訊轉換簡譜系統</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #bfaeae;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .container {
      text-align: center;
      background: url("{{ url_for('static', filename='images/Brown_Collage_Paper_Music_Presentation.png') }}") no-repeat center;
      background-size: cover;
      width: 600px;
      height: 400px;
      padding: 60px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 36px;
      color: #111;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .upload-btn {
      padding: 14px 30px;
      border: none;
      border-radius: 30px;
      background-color: #eee;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .upload-btn:hover {
      background-color: #ddd;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
  <h1>音訊轉換簡譜系統</h1>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label for="file-upload" class="upload-btn">選擇 MIDI 檔案</label>
      <input id="file-upload" type="file" name="file" accept=".mid,.midi" required />

      <label for="bpm"class="upload-btn">請輸入 BPM（預設 80）</label>
      <input id="bpm" type="number" name="bpm" value="80" min="30" max="300" />

      <button type="submit" class="submit-btn">上傳並轉換</button>
    </form>
  </div>
</body>
</html>
