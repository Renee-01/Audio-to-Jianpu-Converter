<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>轉換結果</title>
  <style>
    body{
      font-family:ui-sans-serif,system-ui,"Segoe UI","Noto Sans TC",Arial;
      margin:0;
      background:#f7f7f7;
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
      background:#222;
      color:#fff;
    }
    main{
      max-width:980px;
      margin:16px auto;
      padding:0 16px;
    }
    .card{
      background:#fff;
      border-radius:10px;
      box-shadow:0 6px 16px rgba(0,0,0,.08);
      padding:16px;
      margin-bottom:16px;
    }
    .btn{
      display:inline-block;
      margin-right:8px;
      margin-top:8px;
      padding:10px 14px;
      border-radius:8px;
      background:#0b79d0;
      color:#fff;
      text-decoration:none;
      font-weight:600;
    }
    .pdf-wrapper{
      width:100%;
      height:650px;
      border:1px solid #ccc;
      border-radius:8px;
      overflow:hidden;
      margin-top:8px;
    }
    .pdf-wrapper iframe{
      width:100%;
      height:100%;
      border:none;
    }
  </style>
</head>
<body>
<header>
  <div><strong>轉換結果</strong></div>
  <div>檔名：{{ filename }}</div>
</header>

<main>

  <!-- PDF 卡片 -->
  <div class="card">
    <h3>PDF 樂譜</h3>
    <div>
      {% if pdf_rel %}
        <div class="pdf-wrapper">
          <iframe src="{{ url_for('view_file', subpath=pdf_rel) }}"></iframe>
        </div>
        <a class="btn" href="{{ url_for('download_file', subpath=pdf_rel) }}">下載 PDF</a>
      {% else %}
        <p>⚠️ 目前沒有 PDF。若一直失敗，可以回編輯器稍微調整音長、或檢查產出的 <code>.ly</code>/<code>.txt</code> 檔案。</p>
      {% endif %}
    </div>
  </div>

  
  <!-- 回首頁 -->
  <div class="card">
    <a class="btn" href="{{ url_for('index') }}">回首頁重新上傳</a>
  </div>
</main>
</body>
</html>
