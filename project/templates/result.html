<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>轉換結果</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", Arial; margin: 24px; }
    pre { background: #d5b3b3; padding: 12px; border-radius: 8px; overflow:auto; }
    .pdf { width: 100%; height: 80vh; border: 1px solid #ddd; border-radius: 8px; }
    a.btn { display:inline-block; margin:12px 0; padding:8px 14px; background:#0b79d0; color:#fff; border-radius:6px; text-decoration:none; }
  </style>
</head>
<body>
  <h3>檔案上傳成功：{{ filename }}</h3>
  <p>儲存於：{{ filepath }}</p>

  <h4>簡譜結果：</h4>
  <pre>{{ text_output }}</pre>

  {% if pdf_rel %}
    <p>
      <a class="btn" href="{{ url_for('download_file', subpath=pdf_rel) }}" target="_blank">👉 下載 PDF 樂譜</a>
    </p>
    <!-- 內嵌顯示 PDF（用 inline 路由） -->
    <iframe class="pdf" src="{{ url_for('view_file', subpath=pdf_rel) }}"></iframe>
  {% else %}
    <p>❌ PDF 轉換失敗，請檢查 LilyPond 路徑或轉換過程。</p>
  {% endif %}
</body>
</html>
